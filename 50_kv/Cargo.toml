[package]
name = "kv"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "kvs"
path = "src/server.rs"

[[bin]]
name = "kvc"
path = "src/client.rs"

[dependencies]
anyhow = "1.0.100"
bytes = "1.11.0"
dashmap = "6.1.0"
flate2 = "1.1.8"
futures = "0.3.31"
http = "1.4.0"
prost = "0.10.4"
# rust-rocksdb = "0.44.2"
rustls = "0.19.1"  # 被 tokio-rustls 引用
rustls-native-certs = "0.5"
serde = { version = "1.0.228", features = ["derive"] }
sled = "0.34.7"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
tokio-rustls = "0.22"
tokio-stream = "0.1"
tokio-util = { version = "0.7.17", features = ["codec", "compat"] }
toml = "0.9.11"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
yamux = "0.9"

[dev-dependencies]
async-prost = "0.4.0"
certify = "0.3"
tempfile = "3.24.0"

[build-dependencies]
prost-build = "=0.10.4"  # 需要保持 prost, async-prost 一致
