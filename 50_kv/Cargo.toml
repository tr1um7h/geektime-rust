[package]
name = "kv"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "kvs"
path = "src/server.rs"

[[bin]]
name = "kvc"
path = "src/client.rs"

[dependencies]
anyhow = "1.0.100"
bytes = "1.11.0"
dashmap = "6.1.0"
flate2 = "1.1.8"
http = "1.4.0"
prost = "0.10.4"
rust-rocksdb = "0.44.2"
sled = "0.34.7"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
tokio-util = { version = "0.7.17", features = ["codec"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"

[dev-dependencies]
async-prost = "0.4.0"
futures = "0.3.31"
tempfile = "3.24.0"

[build-dependencies]
prost-build = "=0.10.4"  # 需要保持 prost, async-prost 一致
